[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # typer.Option(...) nei default degli argomenti e' l'idioma di typer
    "BLE001",  # i tool catturano Exception di proposito: non devono mai lanciare
    "DTZ005",  # datetime.now() locale di proposito per nomi file e timestamp di log
    "S110",    # try/except/pass intenzionale (config.yaml opzionale, log non fatale)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
